#!/hint/bash
# shellcheck disable=2034
#
# makepkg.conf — tuned for AMD Ryzen AI 5 340 (Krackan Point, Zen 5, 6C/12T) + 16 GB RAM
#
# Install as EITHER:
#   ~/.config/pacman/makepkg.conf        (per-user, survives pacman upgrades)
#   /etc/makepkg.conf.d/99-local.conf    (system-wide drop-in, also upgrade-safe)
# Both are sourced AFTER /etc/makepkg.conf, so you may trim this down to just
# the lines you actually change. Do not edit /etc/makepkg.conf directly — it
# gets .pacnew'd on every pacman update.
#

#########################################################################
# ARCHITECTURE, COMPILE FLAGS
#########################################################################

CARCH="x86_64"
CHOST="x86_64-pc-linux-gnu"

#-- Compiler and Linker Flags
# -march=native resolves to znver5 on GCC >= 14.1 / LLVM >= 19 (Arch has both).
# Use the explicit -march=znver5 instead if you ever build in a clean chroot,
# where "native" would be the *host* CPU rather than the target.
CPPFLAGS="-D_FORTIFY_SOURCE=3"
CFLAGS="-march=native -mtune=native -O2 -pipe -fno-plt -fexceptions \
        -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security \
        -fstack-clash-protection -fcf-protection \
        -fno-semantic-interposition"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
LDFLAGS="-Wl,-O1 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro -Wl,-z,now \
         -Wl,-z,pack-relative-relocs"
LTOFLAGS="-flto=auto"
RUSTFLAGS="-C target-cpu=native -C opt-level=3"

# 6 cores / 12 threads. -l12 keeps recursive sub-makes from stampeding.
MAKEFLAGS="-j12 -l12"

# Honoured by PKGBUILDs that use meson/ninja/cmake properly.
NINJAFLAGS="-j12"

DEBUG_CFLAGS="-g"
DEBUG_CXXFLAGS="$DEBUG_CFLAGS"
DEBUG_RUSTFLAGS="-C debuginfo=2"

#########################################################################
# BUILD ENVIRONMENT
#########################################################################

# ccache: install it first (`pacman -S ccache`), then set a cache size that
# fits your disk: `ccache -M 20G`. Huge win when you rebuild AUR packages.
# !check skips upstream test suites — the single biggest build-time saving.
BUILDENV=(!distcc color ccache !check !sign)

# Building in tmpfs is fast but /tmp defaults to 50% of RAM = 8 GB here, and
# large packages (llvm, chromium, linux, rust) will blow straight through it.
# Leave this commented unless you know the package is small.
#BUILDDIR=/tmp/makepkg

#########################################################################
# GLOBAL PACKAGE OPTIONS
#########################################################################

# !debug drops the separate -debug package: faster links, much less disk.
# lto is on by default in Arch and is worth keeping.
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)

INTEGRITY_CHECK=(sha256)
STRIP_BINARIES="--strip-all"
STRIP_SHARED="--strip-unneeded"
STRIP_STATIC="--strip-debug"
MAN_DIRS=({usr{,/local}{,/share},opt/*}/{man,info})
DOC_DIRS=(usr/{,local/}{,share/}{doc,gtk-doc} opt/*/{doc,gtk-doc})
PURGE_TARGETS=(usr/{,share}/info/dir .packlist *.pod)
DBGSRCDIR="/usr/src/debug"

#########################################################################
# PACKAGE OUTPUT
#########################################################################

# Keeping sources and built packages out of the build tree means a failed
# build never re-downloads, and you keep a local cache to reinstall from.
PKGDEST="$HOME/.cache/makepkg/pkg"
SRCDEST="$HOME/.cache/makepkg/src"
SRCPKGDEST="$HOME/.cache/makepkg/srcpkg"
LOGDEST="$HOME/.cache/makepkg/log"
#PACKAGER="Your Name <you@example.com>"
#GPGKEY=""

#########################################################################
# COMPRESSION DEFAULTS
#########################################################################

# These packages are for this machine only, so compression ratio buys you
# nothing and compression *time* is pure overhead. -T0 uses all threads,
# level 8 is a good speed/size point. zstd decompresses fast at any level.
COMPRESSZST=(zstd -c -T0 -8 -)
COMPRESSXZ=(xz -c -z --threads=0 -)
COMPRESSGZ=(gzip -c -f -n)
COMPRESSBZ2=(bzip2 -c -f)
COMPRESSLRZ=(lrzip -q)
COMPRESSLZO=(lzop -q)
COMPRESSZ=(compress -c -f)
COMPRESSLZ4=(lz4 -q)
COMPRESSLZ=(lzip -c -f)

#########################################################################
# EXTENSION DEFAULTS
#########################################################################

PKGEXT='.pkg.tar.zst'
# Or skip compression entirely for the fastest possible packaging:
#PKGEXT='.pkg.tar'
SRCEXT='.src.tar.gz'
