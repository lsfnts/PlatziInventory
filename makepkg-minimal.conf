#!/hint/bash
# shellcheck disable=2034
#
# Minimal override drop-in for Ryzen AI 5 340 (Zen 5, 6C/12T) + 16 GB RAM.
# Install as ~/.config/pacman/makepkg.conf or /etc/makepkg.conf.d/99-local.conf
# Everything not listed here keeps the Arch default.
#

CFLAGS="${CFLAGS/-march=x86-64 -mtune=generic/-march=native -mtune=native}"
CXXFLAGS="${CXXFLAGS/-march=x86-64 -mtune=generic/-march=native -mtune=native}"
RUSTFLAGS="$RUSTFLAGS -C target-cpu=native"

MAKEFLAGS="-j12 -l12"

BUILDENV=(!distcc color ccache !check !sign)
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)

COMPRESSZST=(zstd -c -T0 -8 -)

PKGDEST="$HOME/.cache/makepkg/pkg"
SRCDEST="$HOME/.cache/makepkg/src"
LOGDEST="$HOME/.cache/makepkg/log"
